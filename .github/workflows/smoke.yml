name: Smoke test

on:
  push:
  pull_request:

jobs:
  smoke:
    # ubuntu-latest moved to 26.04, which Playwright 1.56 cannot install Chromium on.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:twice
